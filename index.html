<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0df" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Little Train" />
    <title>Little Train</title>
    <style>
      #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 18px; margin: 0; padding: 24px; background: #f6f0df; color: #254457; font-family: system-ui, sans-serif; text-align: center; }
      #loading[hidden] { display: none; }
      #loading h1 { margin: 0; font-size: clamp(24px, 5vw, 40px); }
      #loading img { width: 160px; height: 160px; border-radius: 24px; }
      #loading p { margin: 0; }
      #loading progress { width: 190px; accent-color: #397c70; }
      #retry { color: #254457; padding: 12px 28px; background: white; border-radius: 16px; }
    </style>
  </head>
  <body>
    <section id="loading" role="status" aria-live="polite">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Little Train</h1>
      <p id="loading-stage">Opening the little railway…</p>
      <progress max="3" value="0" aria-label="Preparing the railway"></progress>
      <a id="retry" href="/" hidden>Try again</a>
      <noscript>This game needs JavaScript enabled to run.</noscript>
    </section>
    <script>
      window.littleTrainLoadTimer = setTimeout(function () {
        if (!document.getElementById('loading').hidden) {
          document.getElementById('loading-stage').textContent = 'Taking a little longer. Check your connection or try again.';
          document.getElementById('retry').hidden = false;
        }
      }, 15000);
    </script>
    <main id="app" aria-label="Little Train" inert>
      <canvas id="game" aria-label="A toy railway with meadows, friends and apples"></canvas>
      <div id="ui"></div>
      <p id="pwa-status" role="status"></p>
      <div id="rotate" role="status"><span aria-hidden="true">↻</span><strong>A little turn, please</strong><span class="rotate-copy">Play with your screen sideways</span></div>
      <section id="error" role="alert" hidden><h2>Let's try that again</h2><p id="error-message"></p><a href="/">Reload the game</a></section>
    </main>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
